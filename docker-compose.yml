# Local Postgres 16 for JobDesk. Host port 5442 avoids clashing with other local databases.
services:
  db:
    image: postgres:16-alpine
    container_name: jobdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobdesk
      POSTGRES_PASSWORD: jobdesk
      POSTGRES_DB: jobdesk
    ports:
      - "5442:5432"
    volumes:
      - jobdesk-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobdesk -d jobdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobdesk-pg:
