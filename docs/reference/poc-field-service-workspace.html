<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobDesk · Field Service Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eceff2;--panel:#ffffff;--panel2:#f5f7f9;--ink:#16202a;--muted:#5d6975;--line:#dce1e6;
  --hi:#f5c518;--hi-ink:#16202a;--hi-soft:#fdf3c4;
  --green:#1f7a4d;--green-soft:#dcf1e5;--red:#c0392b;--red-soft:#f8dfdb;--blue:#2459a6;--blue-soft:#dde8f7;
  --amber:#9a6a00;--amber-soft:#fbefcf;--orange:#c4501a;--orange-soft:#fbe4d8;--chip:#e6eaee;
  --shadow:0 1px 0 rgba(22,32,42,.04),0 2px 10px rgba(22,32,42,.05);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a;--panel:#161f28;--panel2:#1b2530;--ink:#e7ecf0;--muted:#94a1ad;--line:#27333f;
  --hi:#f5c518;--hi-ink:#16202a;--hi-soft:#3a3212;
  --green:#5cc68f;--green-soft:#15301f;--red:#ef7868;--red-soft:#3a1c18;--blue:#7eaef0;--blue-soft:#172a44;
  --amber:#e8bb52;--amber-soft:#342a12;--orange:#f08a57;--orange-soft:#3a2216;--chip:#222d38;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a;--panel:#161f28;--panel2:#1b2530;--ink:#e7ecf0;--muted:#94a1ad;--line:#27333f;
  --hi:#f5c518;--hi-ink:#16202a;--hi-soft:#3a3212;
  --green:#5cc68f;--green-soft:#15301f;--red:#ef7868;--red-soft:#3a1c18;--blue:#7eaef0;--blue-soft:#172a44;
  --amber:#e8bb52;--amber-soft:#342a12;--orange:#f08a57;--orange-soft:#3a2216;--chip:#222d38;--shadow:none;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,"Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.tn{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 12px;background:var(--ink);color:#c9d2da}
:root[data-theme="dark"] .side{background:#0a0f14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:#0a0f14}}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--hi);color:var(--hi-ink);display:grid;place-items:center;font-weight:800;font-stretch:115%;letter-spacing:-.5px}
.brand b{display:block;font-size:14px;line-height:1.2;color:#fff;font-stretch:108%}
.brand small{color:#8e9aa6;font-size:12px}
.tape{height:6px;margin:12px 8px 16px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--hi) 0 10px,#16202a 10px 20px)}
.side nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;color:#aeb9c4;font-weight:600;font-size:14px;text-align:left}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:rgba(245,197,24,.14);color:#fff}
.nav.on svg{color:var(--hi)}
.nav .s{display:none}
.side-foot{margin-top:auto}
.main{padding:28px clamp(16px,3vw,40px) 64px;max-width:1320px;width:100%}

/* type & common */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:clamp(24px,2.8vw,32px);font-weight:750;font-stretch:112%;letter-spacing:-.015em;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{margin:6px 0 0;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}.sm{font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:650;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-style:dashed}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
select.btn{padding-right:10px}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--chip);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;margin-bottom:10px;font-weight:600;font-size:14px}
.back:hover{color:var(--ink)}
.link{border:0;background:none;color:var(--blue);font-weight:650;cursor:pointer;padding:0;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:16px;font-weight:700;font-stretch:106%}
.stack{display:grid;gap:16px;align-content:start}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);display:block;margin-bottom:4px}
.empty p{margin:0;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--muted);font-weight:600}
.tag svg{width:13px;height:13px}
.st{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted);white-space:nowrap;letter-spacing:0;font-stretch:100%}
.st-quoted,.st-sent{background:var(--blue-soft);color:var(--blue)}
.st-scheduled,.st-partial{background:var(--amber-soft);color:var(--amber)}
.st-inprogress{background:var(--orange-soft);color:var(--orange)}
.st-completed,.st-accepted,.st-paid{background:var(--green-soft);color:var(--green)}
.st-declined,.st-unpaid{background:var(--red-soft);color:var(--red)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:15px 18px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:750;font-stretch:110%;margin:4px 0 0;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.green b{color:var(--green)}.kpi.red b{color:var(--red)}

/* dashboard */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--panel2);border-radius:10px;padding:10px;min-height:130px;border-top:3px solid var(--line)}
.col.c-quoted{border-top-color:var(--blue)}.col.c-scheduled{border-top-color:var(--amber)}.col.c-inprogress{border-top-color:var(--orange)}.col.c-completed{border-top-color:var(--green)}
.col h3{margin:2px 4px 10px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between}
.col h3 em{font-style:normal;color:var(--muted);font-weight:600}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.jcard:hover{border-color:var(--muted)}
.jcard b{display:block;font-size:13.5px;line-height:1.3;font-weight:650}
.jcard small{display:block;color:var(--muted);font-size:12px;margin:3px 0 8px}
.jcard select{width:100%;font-size:12.5px;padding:5px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px}
.chart{width:100%;height:auto;display:block}
.legend{font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rowlink{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.rowlink:first-child{border-top:0;padding-top:2px}
.rowlink:hover b:first-child{color:var(--blue)}
.rowlink small{display:block;color:var(--muted);font-size:12.5px}
.rowlink .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* customers */
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:min(300px,100%);color:var(--muted)}
.search:focus-within{border-color:var(--blue)}
.search input{border:0;background:none;padding:9px 0;outline:none;flex:1;min-width:0;color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ccard{cursor:pointer;display:flex;flex-direction:column;gap:12px}
.ccard:hover{border-color:var(--muted)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who>div{min-width:0}
.av{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:750;font-size:15px;flex:none;font-stretch:110%}
.av.lg{width:60px;height:60px;font-size:21px;border-radius:14px}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.who small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.latest{font-size:13.5px;padding:10px 12px;background:var(--panel2);border-radius:8px}
.latest small{display:block;color:var(--muted);font-size:12px}
.latest div{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:2px}
.latest div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.phead{display:flex;gap:16px;align-items:center}
.contact{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.contact a,.contact span{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.contact a:hover{color:var(--blue)}
.contact svg{width:15px;height:15px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--hi-soft);padding:10px 14px;border-radius:10px;font-size:14px;margin:4px 0 0;max-width:80ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.stats div{background:var(--panel);padding:12px 16px}
.stats span{font-size:13px;color:var(--muted);font-weight:600}
.stats b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--hi)}
.tab em{font-style:normal;font-size:12px;background:var(--chip);padding:1px 7px;border-radius:999px;margin-left:6px}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.job:first-child{border-top:0;padding-top:0}
.job b{font-weight:700}
.jm{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-top:4px;flex-wrap:wrap}
.jm span{display:inline-flex;gap:5px;align-items:center}
.jm svg{width:14px;height:14px}
.job p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.jr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stsel{border:0;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12.5px;cursor:pointer;background:var(--chip)}

/* photos */
.uprow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.uprow>.f:first-child{flex:1;min-width:220px}
.segb{display:inline-flex;background:var(--chip);padding:3px;border-radius:8px;gap:2px}
.segb button{border:0;background:none;padding:7px 14px;border-radius:6px;font-weight:650;color:var(--muted);cursor:pointer}
.segb button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--panel2);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--hi);background:var(--hi-soft)}
.drop svg{width:26px;height:26px}
.drop input{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:4px 10px;font-size:12.5px}
.pgroup h3{font-size:14.5px;margin:20px 0 10px;display:flex;gap:8px;align-items:center;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ph{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;border:1px solid var(--line);background:var(--chip);padding:0;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .badge{position:absolute;left:7px;top:7px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(16,22,28,.72);color:#fff}
.ph .badge.b-after{background:var(--hi);color:var(--hi-ink)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 9px 7px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.r{text-align:right}
.pos{color:var(--green);font-weight:650}.neg{color:var(--red);font-weight:650}
.nowrap{white-space:nowrap}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:var(--muted)}
.f input,.f select,.f textarea,.ln input,.newcat input,.totals textarea{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 11px;color:var(--ink);font-weight:500;outline:none;width:100%;font-size:14.5px}
.f input:focus,.f select:focus,.f textarea:focus,.ln input:focus,.newcat input:focus,.totals textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--chip);padding:3px;border-radius:9px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px;border-radius:7px;font-weight:650;cursor:pointer;color:var(--muted)}
.seg input:checked+span{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--blue)}

/* quotes */
.qgrid{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:16px;align-items:start}
.picker{position:sticky;top:16px}
.pick-list{max-height:min(58vh,560px);overflow:auto;margin:10px -8px 0;padding:0 8px}
.pick{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;border-radius:8px;padding:8px 10px;background:none;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick b{display:block;font-size:14px;font-weight:650}
.pick small{color:var(--muted);font-size:12.5px}
.plus{font-style:normal;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--hi-soft);color:var(--ink);font-weight:800;flex:none;font-size:17px}
.pick:hover .plus{background:var(--hi)}
.pick.flash .plus{background:var(--green);color:#fff}
.sheet-top{display:grid;grid-template-columns:1fr 1.3fr 160px;gap:12px;margin-bottom:18px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 76px 124px 110px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ln.head{font-size:12.5px;color:var(--muted);font-weight:650;padding-top:0}
.ln .nm input{border-color:transparent;background:transparent;padding:4px 6px;font-weight:650}
.ln .nm input:hover{border-color:var(--line)}
.ln .nm small{display:block;color:var(--muted);font-size:12px;padding-left:7px}
.ln .amt{font-weight:650;font-variant-numeric:tabular-nums}
.pricebox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding-left:10px}
.pricebox em{font-style:normal;color:var(--muted);font-size:14px}
.pricebox input{border:0!important;background:transparent!important;padding-left:5px!important;box-shadow:none!important}
.pricebox:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.num{font-variant-numeric:tabular-nums}
.empty-lines{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:10px;margin:12px 0}
.lines>.btn{margin-top:12px}
.totals{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:20px}
.totals textarea{min-height:130px;resize:vertical}
.tbox{display:grid;gap:9px;align-content:start}
.tbox>div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px}
.tbox b{font-variant-numeric:tabular-nums}
.tbox .pricebox{width:130px}
.tiny{width:66px;padding:5px 7px;margin:0 4px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;outline:none}
.tiny:focus{border-color:var(--blue)}
.grand{border-top:2px solid var(--ink);padding-top:10px;margin-top:4px}
.grand span{font-weight:700;font-size:16px}
.grand b{font-size:26px;font-weight:750;font-stretch:110%}

/* bookkeeping */
.books{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:16px;align-items:start}
.bar{margin-bottom:13px}
.bl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.bl b{font-variant-numeric:tabular-nums}
.bt{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px}

/* catalog */
.catgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.catbtn{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left;gap:8px}
.catbtn em{font-style:normal;font-size:12px;background:var(--chip);padding:1px 8px;border-radius:999px;align-self:center}
.catbtn:hover{color:var(--ink);background:var(--panel2)}
.catbtn.on{background:var(--hi-soft);color:var(--ink)}
.newcat{display:flex;gap:6px;margin-top:12px}
.newcat input{flex:1;min-width:0;padding:7px 10px}
.imp{margin-bottom:16px;border:2px solid var(--hi)}
.impgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
table.mini th,table.mini td{padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line)}
table.mini{border:1px solid var(--line);border-radius:8px}

/* modal / toast */
.mbg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(900px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;gap:10px}
.mh h3{margin:0;font-size:18px;font-weight:700;font-stretch:108%}
.mb{padding:16px 18px 18px;display:grid;gap:13px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.lb{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px}
.lb img{width:100%;border-radius:10px;max-height:66vh;object-fit:contain;background:#0b0f13}
.lb-side{display:grid;gap:12px;align-content:start}
.dz{border-top:1px solid var(--line);padding-top:14px}
.dz p{margin:4px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* quote document */
.paper{background:#fff;color:#16202a;border-radius:10px;padding:36px;border:1px solid #dce1e6}
.qdoc{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;color:#16202a;font-size:14px}
.qdoc .qh{display:flex;justify-content:space-between;gap:20px;padding-bottom:16px;margin-bottom:22px;border-bottom:6px solid transparent;border-image:repeating-linear-gradient(135deg,#f5c518 0 10px,#16202a 10px 20px) 6}
.qdoc h2{margin:0;font-size:22px;font-stretch:110%}
.qdoc .qh p{margin:4px 0 0;color:#5d6975}
.qdoc .big{font-size:30px;font-weight:800;font-stretch:120%;letter-spacing:.02em}
.qmeta{display:flex;gap:48px;margin-bottom:22px;flex-wrap:wrap}
.qmeta small,.qnotes small{display:block;font-size:12px;color:#5d6975;font-weight:700;margin-bottom:3px}
.qmeta b{display:block;font-size:15px}
.qmeta span{display:block;color:#5d6975;font-size:13.5px}
.qdoc table th{color:#5d6975;border-color:#dce1e6}
.qdoc table td{border-color:#eef1f3;color:#16202a}
.qdoc td small{color:#7a8590}
.qdoc .qt{margin-left:auto;width:280px;margin-top:16px}
.qdoc .qt div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.qdoc .qt .g{border-top:2px solid #16202a;margin-top:6px;padding-top:9px;font-weight:800;font-size:19px}
.qnotes{margin-top:22px;padding:12px 14px;background:#f5f7f9;border-radius:8px}
.qnotes p{margin:0}
.qdoc .foot{margin-top:28px;color:#5d6975;font-size:13px}
#print{display:none}
@media print{
  :root{padding:0}
  body{background:#fff}
  .app,.mbg,.toast{display:none!important}
  #print{display:block}
  #print .paper{border:0;padding:0}
}

/* responsive */
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.books{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
  .picker{position:static}
  .pick-list{max-height:280px}
}
@media (max-width:860px){

  .brand,.tape{display:none}
  .side nav{flex-direction:row;flex:5}

  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .job{grid-template-columns:1fr}

}
@media (max-width:520px){

  .paper{padding:20px}
  .qdoc .qt{width:100%}
}

function chart(){
 const now=new Date(),ms=[];for(let i=5;i>=0;i--)ms.push(iso(new Date(now.getFullYear(),now.getMonth()-i,1)).slice(0,7));
 const data=ms.map(m=>({m,inc:sumTx('income',m),exp:sumTx('expense',m)}));
 const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)))*1.15;
 const W=600,H=250,Lp=8,B=30,T=14,cw=(W-Lp*2)/6,ch=H-B-T;let g='';
 for(let k=0;k<=3;k++){const y=T+ch-ch*k/3;g+=`<line x1="${Lp}" x2="${W-Lp}" y1="${y}" y2="${y}" style="stroke:var(--line)" ${k?'stroke-dasharray="3 5"':''}/>`}
 data.forEach((d,i)=>{const cx=Lp+i*cw+cw/2,bw=Math.min(30,cw*.28),hi=ch*d.inc/max,he=ch*d.exp/max;
  g+=`<rect x="${cx-bw-3}" y="${T+ch-hi}" width="${bw}" height="${hi}" rx="4" style="fill:var(--green)"><title>Revenue ${money(d.inc)}</title></rect><rect x="${cx+3}" y="${T+ch-he}" width="${bw}" height="${he}" rx="4" style="fill:var(--orange)"><title>Expenses ${money(d.exp)}</title></rect><text x="${cx}" y="${H-9}" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:var(--muted);font-family:Archivo,Arial,sans-serif">${new Date(d.m+'-01T00:00:00').toLocaleDateString('en-US',{month:'short'})}</text>`;
  if(d.inc)g+=`<text x="${cx-bw/2-3}" y="${T+ch-hi-6}" text-anchor="middle" font-size="11" style="fill:var(--muted);font-family:Archivo,Arial,sans-serif">${short(d.inc)}</text>`;
 });
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenses for the last six months">${g}</svg>`;
}

function vBooks(){

 const byCat=arr=>{const m={};arr.forEach(t=>m[t.category]=(m[t.category]||0)+t.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const bars=(arr,color)=>{const mx=Math.max(1,...arr.map(x=>x[1]));return arr.length?arr.map(([k,v])=>`<div class="bar"><div class="bl"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bt"><i style="width:${(v/mx*100).toFixed(1)}%;background:${color}"></i></div></div>`).join(''):'<p class="muted sm">Nothing recorded for this period.</p>'};

 <div class="actions"><select class="btn" data-change="tm" aria-label="Period"><option value="all">All time</option>${months.map(m=>`<option value="${m}" ${UI.tm===m?'selected':''}>${monthLabel(m)}</option>`).join('')}</select><button class="btn" data-act="newTx" data-type="expense">${I.minus} Log expense</button><button class="btn primary" data-act="newTx" data-type="income">${I.plus} Record revenue</button></div></header>
 <section class="kpis">${kpi('Revenue',money(inc),plural(incs.length,'payment'),'green')}${kpi('Expenses',money(exp),plural(exps.length,'entry').replace('entrys','entries'),'red')}${kpi('Net profit',money(net),UI.tm==='all'?'All time':monthLabel(UI.tm),net>=0?'green':'red')}${kpi('Profit margin',inc?Math.round(net/inc*100)+'%':'None yet','Net profit as a share of revenue')}</section>
 <div class="books"><section class="card"><div class="card-h"><h2>Transactions</h2><div class="chips">${[['all','All'],['income','Revenue'],['expense','Expenses']].map(([k,l])=>`<button class="chip sm ${UI.tt===k?'on':''}" data-act="tt" data-t="${k}">${l}</button>`).join('')}</div></div>
 ${list.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Customer</th><th class="r">Amount</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td class="nowrap">${fmtDate(t.date)}</td><td>${esc(t.desc)}</td><td><span class="tag">${esc(t.category)}</span></td><td class="muted nowrap">${esc(custName(t.customerId)||'None')}</td><td class="r tn nowrap ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'−'}${money(t.amount)}</td><td><button class="icon-btn" data-act="delTx" data-id="${t.id}" aria-label="Delete entry">${I.trash}</button></td></tr>`).join('')}</tbody></table></div>`:empty('No transactions in this view','Record a payment or log an expense.')}</section>
 <div class="stack"><section class="card"><div class="card-h"><h2>Where the money went</h2></div>${bars(byCat(exps),'var(--orange)')}</section><section class="card"><div class="card-h"><h2>Where it came from</h2></div>${bars(byCat(incs),'var(--green)')}</section></div></div>`;
}

function importRows(rows){
 rows=rows.map(r=>(Array.isArray(r)?r:[r]).map(x=>String(x??'').trim())).filter(r=>r.some(Boolean));
 if(!rows.length){toast('No rows found to import');return}
 let ci=0,ii=1,ui=2,start=0;const h=rows[0].map(x=>x.toLowerCase());
 if(h.some(x=>/categor|item|service|name|unit/.test(x))){start=1;const f=re=>h.findIndex(x=>re.test(x));const b=f(/item|service|name|description/);if(b>=0){ii=b;ci=f(/categor/);ui=f(/unit/)}}
 else if(rows[0].length===1){ci=-1;ii=0;ui=-1}
 let added=0,skipped=0;
 for(const r of rows.slice(start)){const name=r[ii];if(!name){skipped++;continue}
  const category=(ci>=0&&r[ci])||'Uncategorized',unit=(ui>=0&&r[ui])||'each';
  if(S.catalog.some(i=>i.name.toLowerCase()===name.toLowerCase()&&i.category.toLowerCase()===category.toLowerCase())){skipped++;continue}
  S.catalog.push({id:uid(),name,category,unit});added++}
 save();UI.showImport=false;UI.kc='All';render();toast(`Imported ${plural(added,'item')}${skipped?`, skipped ${skipped}`:''}`);
}

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const M=1024;let w=img.width,h=img.height;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',.72))};img.onerror=()=>res(null);img.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
async function handleFiles(files){
 const list=[...(files||[])].filter(f=>f.type.startsWith('image/'));if(!list.length){toast('Choose image files to upload');return}
 toast(`Adding ${plural(list.length,'photo')}…`);let n=0;
 for(const f of list){const src=await shrink(f);if(!src)continue;S.photos.push({id:uid(),customerId:UI.cid,jobId:UI.upJob,stage:UI.upStage,caption:f.name.replace(/\.[^.]+$/,''),date:today(),src});n++}
 save();render();toast(n?`${plural(n,'photo')} added to ${UI.upStage.toLowerCase()}`:'Those files could not be read as images');
}

 addLine:el=>{const q=curQ(),it=S.catalog.find(i=>i.id===el.dataset.id);if(!q||!it)return;
  const ex=q.lines.findIndex(l=>l.name===it.name);
  if(ex>=0)q.lines[ex].qty=(+q.lines[ex].qty||0)+1;else q.lines.push({name:it.name,category:it.category,unit:it.unit,qty:1,price:''});
  save();$('#sheet').innerHTML=sheetHTML(q);updT(q);
  el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),500);
  if(ex<0&&matchMedia('(min-width:1101px)').matches)$('#sheet').querySelector(`[data-ql="price"][data-i="${q.lines.length-1}"]`)?.focus();
  toast(ex>=0?`${it.name}: quantity ${q.lines[ex].qty}`:`Added ${it.name}. Enter your price.`)},
 customLine:()=>{const q=curQ();q.lines.push({name:'Custom item',category:'Custom',unit:'',qty:1,price:''});save();$('#sheet').innerHTML=sheetHTML(q);const inp=$('#sheet').querySelector(`[data-ql="name"][data-i="${q.lines.length-1}"]`);inp?.focus();inp?.select()},
 rmLine:el=>{const q=curQ();q.lines.splice(+el.dataset.i,1);save();$('#sheet').innerHTML=sheetHTML(q);updT(q)},
 qStatus:el=>{const q=curQ(),s=el.dataset.s;
  if(s==='Accepted'){q.status='Accepted';let job=S.jobs.find(j=>j.id===q.jobId);
   if(!job){job={id:uid(),customerId:q.customerId,title:q.title||q.lines[0]?.name||`Job from ${q.number}`,status:'Scheduled',date:today(),notes:`Created from quote ${q.number}`};S.jobs.push(job);q.jobId=job.id}
   else if(['Lead','Quoted'].includes(job.status))job.status='Scheduled';
   toast('Quote accepted. Job added to the pipeline as Scheduled.')}
  else{q.status=s;const job=S.jobs.find(j=>j.id===q.jobId);if(s==='Sent'&&job&&job.status==='Lead')job.status='Quoted';toast(s==='Sent'?'Marked as sent':s==='Declined'?'Marked declined':'Reopened as draft')}
  save();render()},
 qPay:()=>{const q=curQ(),t=qTotals(q).total,p=paidFor(q);txModal({type:'income',amount:(t-p).toFixed(2),customerId:q.customerId,desc:`Payment for ${q.number}`,category:p>0?'Job Payment':'Deposit',quoteId:q.id})},
 qPreview:()=>{const q=curQ();modal({title:`Quote ${q.number}`,wide:true,body:`<div class="paper">${quoteDoc(q)}</div><div class="mf"><button type="button" class="btn" data-act="closeModal">Close</button><button type="button" class="btn primary" data-act="qPrint">${I.print} Print or save as PDF</button></div>`})},
 qPrint:()=>{const q=curQ();$('#print').innerHTML=`<div class="paper">${quoteDoc(q)}</div>`;try{window.print()}catch(e){toast('Printing is blocked here. Open the page in its own tab to print.')}},
 qDelete:()=>{const q=curQ();confirmDlg(`Delete quote ${q.number}? Payments already recorded stay in the books.`,()=>{S.quotes=S.quotes.filter(x=>x.id!==q.id);save();UI.view='quotes';render();toast('Quote deleted')})},
 newTx:el=>txModal({type:el.dataset.type,customerId:UI.view==='customer'?UI.cid:''}),
 delTx:el=>{const id=el.dataset.id;confirmDlg('Delete this entry from the books?',()=>{S.tx=S.tx.filter(t=>t.id!==id);save();render();toast('Entry deleted')})},
 tt:el=>{UI.tt=el.dataset.t;render()},
 kc:el=>{UI.kc=el.dataset.c;render()},
 newItem:()=>itemModal(),
 delItem:el=>{const it=S.catalog.find(i=>i.id===el.dataset.id);S.catalog=S.catalog.filter(i=>i.id!==el.dataset.id);save();render();toast(`Removed ${it?.name||'item'}`)},
 toggleImport:()=>{UI.showImport=!UI.showImport;render()},
 importPaste:()=>{const text=$('#pasteBox')?.value||'';importRows(text.split(/\r?\n/).map(l=>l.split(l.includes('\t')?'\t':',')))},
 settings:()=>modal({title:'Settings',body:`${fld('Business name','company',S.settings.company)}<div class="row2">${fld('Currency symbol','currency',S.settings.currency,'text','maxlength="4"')}${fld('Default tax %','tax',S.settings.tax,'number','step="0.01" min="0"')}</div>
  <label class="f"><span>Appearance</span><select name="theme">${[['system','Match my device'],['light','Light'],['dark','Dark']].map(([v,l])=>`<option value="${v}" ${S.settings.theme===v?'selected':''}>${l}</option>`).join('')}</select></label>
  <div class="dz"><b>Sample data</b><p class="muted sm">This proof of concept keeps everything in this browser, so each person who opens it gets their own copy.</p><div class="actions"><button type="button" class="btn sm" data-act="resetDemo">Reload sample data</button><button type="button" class="btn sm danger" data-act="clearAll">Start with a blank slate</button></div></div>`,
  submit:'Save settings',onSubmit:fd=>{S.settings.company=fd.company.trim()||'Your Company';S.settings.currency=fd.currency.trim()||'$';S.settings.tax=+fd.tax||0;S.settings.theme=fd.theme;save();render();toast('Settings saved')}}),
 resetDemo:()=>confirmDlg('Replace everything with the sample customers, jobs and quotes?',()=>{const keep=S.settings;S=seed();S.settings={...S.settings,company:keep.company,currency:keep.currency,theme:keep.theme};save();closeAll();UI.view='dashboard';render();toast('Sample data reloaded')},'Reload'),
 clearAll:()=>confirmDlg('Remove all customers, jobs, photos, quotes and transactions? The item catalog stays.',()=>{S={...S,customers:[],jobs:[],photos:[],quotes:[],tx:[],seq:1001};save();closeAll();UI.view='dashboard';render();toast('Blank slate ready')},'Clear everything'),
 closeModal:el=>el.closest('.mbg')?.remove()
};
const CH={
 jobStatus:el=>{const j=S.jobs.find(x=>x.id===el.dataset.id);if(!j)return;j.status=el.value;save();render();toast(`Moved to ${el.value}`)},
 qCust:el=>{const q=curQ();q.customerId=el.value;save();render()},
 upJob:el=>{UI.upJob=el.value},
 upFiles:el=>{handleFiles(el.files);el.value=''},
 tm:el=>{UI.tm=el.value;render()},
 txType:el=>{const s=$('#txcat');if(s)s.innerHTML=catOpts(el.value);const h=el.closest('.modal')?.querySelector('.mh h3');if(h)h.textContent=el.value==='income'?'Record revenue':'Log expense'},
 phCap:el=>{const p=S.photos.find(x=>x.id===el.dataset.id);if(p){p.caption=el.value;save();render()}},
 phStage:el=>{const p=S.photos.find(x=>x.id===el.dataset.id);if(p){p.stage=el.value;save();render()}},
 phJob:el=>{const p=S.photos.find(x=>x.id===el.dataset.id);if(p){p.jobId=el.value;save();render()}},
 importFile:async el=>{const f=el.files[0];if(!f)return;try{let rows;if(/\.csv$/i.test(f.name)&&!window.XLSX){rows=(await f.text()).split(/\r?\n/).map(l=>l.split(','))}else{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}importRows(rows)}catch(e){toast('That file could not be read. Try saving it as .xlsx or .csv.')}el.value=''}
};
const IN={
 cs:el=>{UI.cs=el.value;$('#custGrid').innerHTML=custGridHTML()},
 qs:el=>{UI.qs=el.value;$('#pickList').innerHTML=pickListHTML()},
 ks:el=>{UI.ks=el.value;$('#itemsBody').innerHTML=itemsHTML()}
};
const FORMS={
 newCat:f=>{const v=f.cat.value.trim();if(!v)return;if(catList().some(c=>c.toLowerCase()===v.toLowerCase())){toast('That category already exists');return}S.extraCats=[...(S.extraCats||[]),v];UI.kc=v;save();render();toast(`Category ${v} added`)}
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{if(e.target.closest('[data-stop]'))return;const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=[...document.querySelectorAll('.mbg')].pop();if(m)m.remove();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ccard')){e.preventDefault();ACT.openCustomer(e.target)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.change&&CH[el.dataset.change])CH[el.dataset.change](el)});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.ql){const q=curQ();if(!q)return;const l=q.lines[+el.dataset.i];if(!l)return;l[el.dataset.ql]=el.value;const lt=document.getElementById('lt'+el.dataset.i);if(lt)lt.textContent=money((+l.qty||0)*(+l.price||0));updT(q);saveSoon()}
 else if(el.dataset.qf){const q=curQ();if(!q)return;q[el.dataset.qf]=el.value;updT(q);saveSoon()}
 else if(el.dataset.input&&IN[el.dataset.input])IN[el.dataset.input](el)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form]?.(f)});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');handleFiles(e.dataTransfer.files)}});

/* ---------- render ---------- */
function render(){
 applyTheme();
 $('#side').innerHTML=side();
 const V={dashboard:vDashboard,customers:vCustomers,customer:vCustomer,quotes:vQuotes,quote:vQuote,books:vBooks,catalog:vCatalog}[UI.view]||vDashboard;
 $('#main').innerHTML=V();
}
load();render();
</script>
</body>
</html>
